description: 'Minerals Technologies Inc. (NYSE: MTX) is a New York-headquartered, Fortune 1000 resource- and technology-based
  company that develops, produces and markets specialty minerals, mineral-based and synthetic mineral products and
  related systems and services across two segments, Consumer & Specialties (household and personal care, specialty
  additives) and Engineered Solutions (high-temperature technologies, environmental and infrastructure), through
  brands including Specialty Minerals, Minteq, CETCO and AMCOL, with more than 110 locations worldwide. It sells
  physical products through direct sales and distributors and publishes no developer portal, public API, SDK or
  machine-readable contract.'
